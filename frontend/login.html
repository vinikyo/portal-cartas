<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portal de Cartas — Login</title>
  <script src="js/theme.js"></script>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="login-page">
  <button type="button" class="btn btn--icon btn--ghost theme-toggle theme-toggle--floating" data-theme-toggle aria-label="Alternar tema">
    <svg class="btn__icon theme-toggle__sun" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/></svg>
    <svg class="btn__icon theme-toggle__moon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5 8.5 8.5 0 1 0 20.5 14.2Z"/></svg>
  </button>
  <main class="login-card">
    <div class="login-card__brand">
      <span class="brand"><span class="brand__accent">Portal</span><span class="brand__main">Cartas</span></span>
    </div>
    <h1 class="login-card__title">Área administrativa</h1>
    <p class="login-card__subtitle">Acesse com seu usuário e senha</p>

    <form id="login-form" class="form" novalidate>
      <div class="form-group">
        <label for="username">Usuário</label>
        <input type="text" id="username" name="username" autocomplete="username" required />
        <span class="field-error" data-error-for="username"></span>
      </div>

      <div class="form-group">
        <label for="password">Senha</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required />
        <span class="field-error" data-error-for="password"></span>
      </div>

      <button type="submit" id="login-button" class="btn btn--primary btn--full">Entrar</button>
    </form>
  </main>

  <div id="toast-container" aria-live="polite"></div>

  <script src="js/consts.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
