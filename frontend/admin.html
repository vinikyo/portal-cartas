<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portal de Cartas — Gerenciador</title>
  <script src="js/theme.js"></script>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="admin-page">
  <header class="topbar">
    <h1 class="topbar__title">
      <span class="brand"><span class="brand__accent">Portal</span><span class="brand__main">Cartas</span></span>
      <span style="font-weight:400; color: var(--color-text-muted); font-style: normal;"> · Gerenciador</span>
    </h1>
    <div class="topbar__user">
      <span id="current-username"></span>
      <button type="button" class="btn btn--icon btn--ghost theme-toggle" data-theme-toggle aria-label="Alternar tema">
        <svg class="btn__icon theme-toggle__sun" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/></svg>
        <svg class="btn__icon theme-toggle__moon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5 8.5 8.5 0 1 0 20.5 14.2Z"/></svg>
      </button>
      <button id="logout-button" class="btn btn--ghost">Sair</button>
    </div>
  </header>

  <main class="admin-content">
    <div class="admin-content__actions">
      <button id="new-card-button" class="btn btn--primary">+ Nova Carta</button>
    </div>

    <div class="filters">
      <div class="form-group filters__search">
        <label for="filter-search">Buscar</label>
        <input type="search" id="filter-search" placeholder="Buscar por nome, ex: pikachu..." />
      </div>
      <div class="form-group">
        <label for="filter-game">Card Game</label>
        <select id="filter-game">
          <option value="">Todos</option>
          <option value="magic">Magic: The Gathering</option>
          <option value="pokemon">Pokémon</option>
          <option value="yugioh">Yu-Gi-Oh!</option>
        </select>
      </div>
      <div class="form-group">
        <label for="filter-rarity">Raridade</label>
        <select id="filter-rarity">
          <option value="">Todas</option>
          <option value="common">Comum</option>
          <option value="uncommon">Incomum</option>
          <option value="rare">Rara</option>
          <option value="super_rare">Super Rara</option>
          <option value="ultra_rare">Ultra Rara</option>
          <option value="secret_rare">Secreta Rara</option>
        </select>
      </div>
    </div>

    <div id="table-wrapper" class="table-wrapper">
      <table class="cards-table">
        <colgroup>
          <col class="col-image" />
          <col class="col-name-en" />
          <col class="col-name-pt" />
          <col class="col-game" />
          <col class="col-edition" />
          <col class="col-rarity" />
          <col class="col-actions" />
        </colgroup>
        <thead>
          <tr>
            <th>Imagem</th>
            <th>Nome (EN)</th>
            <th>Nome (PT)</th>
            <th>Card Game</th>
            <th>Edição</th>
            <th>Raridade</th>
            <th aria-label="Ações"></th>
          </tr>
        </thead>
        <tbody id="cards-tbody">
          <!-- linhas inseridas via JS -->
        </tbody>
      </table>
      <p id="empty-state" class="empty-state" hidden>Nenhuma carta cadastrada ainda.</p>
      <p id="loading-state" class="loading-state">Carregando cartas...</p>
    </div>

    <nav id="pagination" class="pagination" hidden aria-label="Paginação de cartas">
      <button id="pagination-prev" type="button" class="btn btn--ghost btn--small">&larr; Anterior</button>
      <span id="pagination-info" class="pagination__info"></span>
      <button id="pagination-next" type="button" class="btn btn--ghost btn--small">Próxima &rarr;</button>
    </nav>
  </main>

  <footer class="site-footer">
    <div class="site-footer__inner">
      <p class="site-footer__credit">Desenvolvido por <strong>Vinícius</strong></p>
      <nav class="site-footer__links" aria-label="Contatos de Vinícius">
        <a href="https://www.linkedin.com/in/vin%C3%ADcius-garcia-44b3a8217/" target="_blank" rel="noopener noreferrer">
          <svg class="site-footer__icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M0 1.15C0 .51.53 0 1.18 0h13.64C15.47 0 16 .51 16 1.15v13.7c0 .64-.53 1.15-1.18 1.15H1.18C.53 16 0 15.49 0 14.85V1.15Zm4.94 12.25V6.17H2.54v7.23h2.4ZM3.74 5.18c.84 0 1.37-.56 1.37-1.26-.02-.72-.53-1.26-1.35-1.26-.82 0-1.36.54-1.36 1.26 0 .7.52 1.26 1.31 1.26h.03Zm4.91 8.22V9.36c0-.22.02-.43.08-.59.17-.43.56-.88 1.22-.88.86 0 1.2.66 1.2 1.62v3.89h2.4V9.23c0-2.24-1.2-3.28-2.8-3.28-1.29 0-1.87.71-2.19 1.21h.03v-.99h-2.4c.03.66 0 7.23 0 7.23h2.4Z"/></svg>
          <span>LinkedIn</span>
        </a>
        <a href="https://github.com/vinikyo/" target="_blank" rel="noopener noreferrer">
          <svg class="site-footer__icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M8 0a8 8 0 0 0-2.53 15.59c.4.07.55-.17.55-.39 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.53-.01-.54.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.22 2.2.82A7.6 7.6 0 0 1 8 3.84c.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .22.15.47.55.39A8 8 0 0 0 8 0Z"/></svg>
          <span>GitHub</span>
        </a>
        <a href="mailto:vinicius_garcia@outlook.com.br">
          <svg class="site-footer__icon site-footer__icon--stroke" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m4 7 8 6 8-6"/></svg>
          <span>vinicius_garcia@outlook.com.br</span>
        </a>
      </nav>
    </div>
  </footer>

  <!-- Modal de criar/editar -->
  <div id="card-modal" class="modal" hidden>
    <div class="modal__backdrop" data-close-modal></div>
    <div class="modal__panel" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal__header">
        <h2 id="modal-title">Nova Carta</h2>
        <button class="modal__close" data-close-modal aria-label="Fechar">&times;</button>
      </div>

      <form id="card-form" class="form" novalidate>
        <input type="hidden" id="card-id" name="id" />

        <div class="form-group">
          <label for="name_en">Nome em inglês *</label>
          <input type="text" id="name_en" name="name_en" required maxlength="150" />
          <div class="form-group__footer">
            <span class="field-error" data-error-for="name_en"></span>
            <span class="field-hint" data-counter-for="name_en">0/150</span>
          </div>
        </div>

        <div class="form-group">
          <label for="name_pt">Nome em português</label>
          <input type="text" id="name_pt" name="name_pt" maxlength="150" />
          <div class="form-group__footer">
            <span class="field-error" data-error-for="name_pt"></span>
            <span class="field-hint" data-counter-for="name_pt">0/150</span>
          </div>
        </div>

        <div class="form-group">
          <label for="card_game">Card Game *</label>
          <select id="card_game" name="card_game" required>
            <option value="">Selecione...</option>
            <option value="magic">Magic: The Gathering</option>
            <option value="pokemon">Pokémon</option>
            <option value="yugioh">Yu-Gi-Oh!</option>
          </select>
          <span class="field-error" data-error-for="card_game"></span>
        </div>

        <div class="form-group">
          <label for="edition_id">Edição *</label>
          <select id="edition_id" name="edition_id" required disabled>
            <option value="">Selecione um Card Game primeiro</option>
          </select>
          <span class="field-error" data-error-for="edition_id"></span>
        </div>

        <div class="form-group">
          <label for="image_file">Imagem da Carta</label>

          <div class="image-upload">
            <div class="image-upload__preview-box">
              <img id="image_preview" class="image-upload__preview" alt="Pré-visualização da carta" hidden />
              <div id="image_preview_placeholder" class="card-thumb card-thumb--placeholder">
                Sem imagem
              </div>
            </div>
            <input type="file" id="image_file" accept="image/png, image/jpeg, image/webp" />
          </div>

          <button
            type="button"
            id="remove-image-button"
            class="btn btn--small btn--icon btn--danger image-remove-button"
            aria-label="Remover imagem atual"
            aria-pressed="false"
            title="Remover imagem atual"
            hidden
          >
            <svg class="btn__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 7h16M9 7V4h6v3m3 0-1 13H7L6 7m4 4v5m4-5v5"/></svg>
          </button>

          <input type="hidden" id="image_url" name="image_url" />
          <span class="field-error" data-error-for="image_url"></span>
        </div>

        <div class="form-group">
          <label for="rarity">Raridade *</label>
          <select id="rarity" name="rarity" required>
            <option value="">Selecione...</option>
            <option value="common">Comum</option>
            <option value="uncommon">Incomum</option>
            <option value="rare">Rara</option>
            <option value="super_rare">Super Rara</option>
            <option value="ultra_rare">Ultra Rara</option>
            <option value="secret_rare">Secreta Rara</option>
          </select>
          <span class="field-error" data-error-for="rarity"></span>
        </div>

        <div class="modal__footer">
          <button type="button" class="btn btn--ghost" data-close-modal>Cancelar</button>
          <button type="button" id="save-card-button" class="btn btn--primary">Salvar</button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast-container" aria-live="polite"></div>

  <script src="js/consts.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/name-popover.js"></script>
  <script src="js/api.js"></script>
  <script src="js/card-modal.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
